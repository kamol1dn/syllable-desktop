<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;">
<title>Syllable settings</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <nav class="side" aria-label="Sections">
    <div class="brand">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M9 17.5V6.2l10-2.2v11.3" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="17.5" r="2.6" fill="#fff"/><circle cx="16.5" cy="15.3" r="2.6" fill="#fff"/></svg>
      </span>
      <span class="name">Syllable</span>
    </div>
    <div id="nav" class="nav"></div>
    <div class="side-foot">
      <div id="saved" class="saved" aria-live="polite">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Changes apply instantly</span>
      </div>
    </div>
  </nav>
  <main id="main" class="main" tabindex="-1">
    <div id="pages" class="pages"></div>
  </main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
